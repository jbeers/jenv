unbind r
bind r source-file ~/.tmux.conf

# set -g prefix C-s

set -g mouse on

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin '~/jenv/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'egel/tmux-gruvbox' # Gruvbox theme
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @tmux-gruvbox 'dark256' # or 'dark256', 'light', 'light256'

# Override highlight color to be darker (using gruvbox dark gray bg)
set -g mode-style 'bg=#3c3836,fg=#ebdbb2'

set -g default-terminal screen-256color
set -g terminal-overrides ",alacritty:RGB"

set-option -g pane-active-border-style fg=blue

set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Kansas City"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

# Initalize tmux plugin manager (keep at bottom of file)
run '~/jenv/tpm/tpm'
